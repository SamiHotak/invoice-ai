# Runs on every push to GitHub: the tests, and a check that the Docker image builds.
# GitHub has no GPU, so the model is never loaded here (the tests use a fake pipeline).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (CPU PyTorch is enough, the tests do not load the model)
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the image is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the image
        run: docker build -t invoice-ai:ci .
      - name: Check the image (imports and OCR, no GPU needed)
        run: docker run --rm invoice-ai:ci python -c "import api.main, ui.gradio_app; print('Imports OK')"
      - name: Show the image size
        run: docker image ls invoice-ai:ci
